name: Go checks
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - run: go test -race ./...
      - run: go vet ./...
      - run: go run golang.org/x/vuln/cmd/govulncheck@v1.10.0 ./...
      - run: go build ./...
      - run: node --check internal/server/static/app.js && node scripts/dashboard.test.cjs
      - run: python3 scripts/init-env.py && docker compose config --quiet
      - name: Validate standalone configuration
        run: docker compose -f compose.standalone.yml config --quiet
        env:
          FLAGGUARD_AUTH_TOKEN: ci-placeholder-not-a-real-secret-000000
          FLAGSMITH_API_URL: http://flagsmith:8000/api/v1
          FLAGSMITH_ADMIN_TOKEN: ci-placeholder
          FLAGSMITH_ENV_KEY: ci-placeholder
          PROMETHEUS_URL: http://prometheus:9090
      - name: Check the Linux rollback deadline and exact triggering poll
        run: make replay-ubuntu
      - name: Check the recorded checkout incident
        uses: ./
        with:
          policy: guardrails.yaml
          trace: docs/evidence/checkout-trace.json
          expect: checkout_flow=error_rate
      - name: Check quiet, transient and sustained price incidents
        uses: ./
        with:
          policy: deploy/blackbox/guardrails.yaml
          suite: deploy/blackbox/cases/suite.json
      - name: Check indexed and regressed PostgreSQL queries
        uses: ./
        with:
          policy: deploy/postgres/guardrails.yaml
          suite: deploy/postgres/cases/suite.json
      - name: Rehearse the read-only rollback skill
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/rollback-tools"
          cd "$RUNNER_TEMP/rollback-tools"
          curl --fail --silent --show-error --location --retry 3 -o cli.tar.gz \
            https://github.com/Flagsmith/flagsmith-cli/releases/download/v2.0.0/flagsmith_2.0.0_linux_amd64.tar.gz
          echo "7f7cf6f67682b369dbb33c6f7a11e5edb558397b26852409c46f931236aed179  cli.tar.gz" | sha256sum --check
          tar -xzf cli.tar.gz flagsmith
          cd "$GITHUB_WORKSPACE"
          go build -o "$RUNNER_TEMP/rollback-tools/flagguard" ./cmd/flagguard
          PATH="$RUNNER_TEMP/rollback-tools:$PATH" python3 scripts/rehearse-rollback-skill.py
