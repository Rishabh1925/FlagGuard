global:
  scrape_interval: 5s
  scrape_timeout: 4s
scrape_configs:
  - job_name: price_contract
    metrics_path: /probe
    params: {module: [price_contract]}
    static_configs:
      - targets: [http://prices:8000/control.json]
        labels: {variant: control}
      - targets: [http://prices:8000/candidate.json]
        labels: {variant: candidate}
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: exporter:9115
